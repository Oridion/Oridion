[package]
name = "oridion"
version = "4.0.0"
description = "Oridion Galaxy"
edition = "2021"

[lib]
crate-type = ["cdylib"]
name = "oridion"

[features]
no-entrypoint = []
idl-build = ["anchor-lang/idl-build"]
localnet-test-authority = []

[dependencies]
anchor-lang = { version = "1.2.0", features = ["init-if-needed"] }
solana-security-txt = "1.1.1"
solana-sha256-hasher = { version = "3.1.0", features = ["sha2"] }
solana-keccak-hasher = { version = "3.1.0", features = ["sha3"] }
spl-memo = { version = "6.0.0", features = ["no-entrypoint"] }
